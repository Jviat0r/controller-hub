[package]
name = "controller-hub"
version = "0.1.0"
edition = "2021"
description = "A simple 4-player controller hub for Windows"
default-run = "controller-hub"

[workspace]
members = ["core"]

[lib]
name = "controller_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
controller-hub-core = { path = "core" }

[dependencies]
controller-hub-core = { path = "core" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
vigem-client = { version = "0.1", features = ["unstable_xtarget_notification"] }
windows = { version = "0.62", features = [
  "Devices_Enumeration",
  "Devices_Bluetooth",
  "Foundation",
  "Foundation_Collections",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_XboxController",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-collections = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
